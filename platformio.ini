[platformio]
; Without -e, PlatformIO builds and uploads ONLY the current board. The rev2 firmware drives GPIO9 as an output
; (radar power switch); on the current board GPIO9 is the power / LED-off button, so it must never be flashed there.
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
; pioarduino 54.03.20 = Arduino-ESP32 3.2.0 / ESP-IDF 5.4: the installed platform (its .piopm URI)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0

board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    sensirion/Sensirion I2C SCD4x @ ^1.1.0
    claws/BH1750 @ ^1.3.0
    enjoyneering/HTU21D @ ^1.2.1
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.4.3
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.5

; Board revision 2 (radar power switch Q1/Q2 on GPIO9, button ladder on GPIO8): pio run -e seeed_xiao_esp32s3_rev2
[env:seeed_xiao_esp32s3_rev2]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -D BOARD_REV2
