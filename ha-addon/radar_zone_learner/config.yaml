name: "Radar Zone Learner"
version: "0.4.0"
slug: "radar_zone_learner"
description: "Learns places from the LED matrix node's LD2454 radar frames (P4: shadow mode, suggestions only)."
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
timeout: 20
services:
  - "mqtt:need"
watchdog: "tcp://[HOST]:[PORT:8099]"
backup: hot
options:
  log_level: info
  node_prefix: led_matrix_node
  discovery_prefix: homeassistant
  debug_map: true
  night_lux: 5.0
schema:
  log_level: "list(debug|info|warning|error)"
  node_prefix: 'match(^[A-Za-z0-9_/-]{1,64}$)'
  discovery_prefix: 'match(^[A-Za-z0-9_-]{1,64}$)'
  debug_map: bool
  night_lux: "float(0.1,500)"
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
